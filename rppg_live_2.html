<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triage.africa — rPPG</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#FFFFFF; --surface:#F7F8FA; --surface2:#EDEFF2;
  --cyan:#3D4F66; --cyan-dim:rgba(61,79,102,.1);
  --red:#D63A3A; --text:#3D4F66; --muted:#8B95A3; --border:#E2E5EA;
  --mono:'JetBrains Mono',monospace; --ui:'Inter',sans-serif;
}
body { background:var(--bg); color:var(--text); font-family:var(--ui);
  min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:0 0 3rem; }
header { width:100%; padding:1.25rem 2rem; display:flex; align-items:center; gap:.75rem;
  border-bottom:1px solid var(--border); background:var(--surface); }
header h1 { font-family:var(--mono); font-size:1rem; font-weight:600;
  letter-spacing:.12em; color:var(--cyan); text-transform:uppercase; }
.sub { font-size:.75rem; color:var(--muted); margin-left:auto; font-family:var(--mono); letter-spacing:.08em; }
.main { width:100%; max-width:900px; padding:2rem 1.5rem 0; display:flex; flex-direction:column; gap:1.5rem; }

/* Un seul canvas — pas de <video> visible */
.video-wrap { position:relative; width:100%; aspect-ratio:4/3;
  background:#050810; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
#canvas { display:block; width:100%; height:100%; }
/* video cachée, sert de source pour drawImage */
#video { display:none; }

.corner { position:absolute; width:24px; height:24px; z-index:3; }
.corner--tl { top:12px;left:12px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
.corner--tr { top:12px;right:12px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); }
.corner--bl { bottom:12px;left:12px; border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); }
.corner--br { bottom:12px;right:12px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }
.vid-status { position:absolute; top:16px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:.65rem; letter-spacing:.1em; color:var(--cyan);
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.3);
  border-radius:4px; padding:3px 10px; z-index:4; text-transform:uppercase; white-space:nowrap; }
.vid-timer { position:absolute; bottom:16px; right:16px; font-family:var(--mono);
  font-size:1.4rem; font-weight:600; color:var(--cyan); z-index:4; display:none; }
.placeholder { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:.75rem; z-index:5; background:#050810; }
.placeholder svg { opacity:.18; }
.placeholder p { font-family:var(--mono); font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }

.controls { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
.btn { font-family:var(--mono); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase;
  font-weight:600; padding:.75rem 1rem; border-radius:6px; border:1px solid;
  cursor:pointer; transition:background .15s; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn:disabled { opacity:.3; cursor:not-allowed; }
.btn-cyan { background:transparent; border-color:var(--cyan); color:var(--cyan); }
.btn-cyan:not(:disabled):hover { background:var(--cyan-dim); }
.btn-red  { background:transparent; border-color:var(--red);  color:var(--red); }
.btn-red:not(:disabled):hover  { background:rgba(255,68,68,.12); }
.btn-dl   { grid-column:1/-1; background:var(--cyan); border-color:var(--cyan); color:#FFFFFF; font-size:.8rem; }
.btn-dl:not(:disabled):hover { background:#2a3441; }

.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; }
.metric { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:.75rem 1rem; }
.metric label { display:block; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:.35rem; }
.metric .val  { font-family:var(--mono); font-size:1.15rem; font-weight:600; color:var(--cyan); }
.metric .unit { font-family:var(--mono); font-size:.65rem; color:var(--muted); margin-left:3px; }

.roi-legend { display:flex; flex-wrap:wrap; gap:.5rem .75rem; padding:.75rem 1rem;
  background:var(--surface); border:1px solid var(--border); border-radius:8px; }
.roi-legend span { font-family:var(--mono); font-size:.65rem; letter-spacing:.07em;
  display:flex; align-items:center; gap:5px; }
.roi-dot { width:10px; height:10px; border-radius:2px; display:inline-block; }

.settings { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1rem 1.25rem; }
.settings h2 { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:.85rem; }
.sgrid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.field label { display:block; font-size:.7rem; color:var(--muted); margin-bottom:.3rem; }
.field select, .field input[type=number] { width:100%; background:var(--surface2); border:1px solid var(--border);
  border-radius:5px; color:var(--text); font-family:var(--mono); font-size:.8rem; padding:.45rem .75rem; outline:none; }
.field select:focus,.field input:focus { border-color:var(--cyan); }
.field select option { background:var(--surface2); }

.export-section { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1rem 1.25rem; }
.export-section h2 { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:.85rem; }
.log-entry { display:flex; justify-content:space-between; padding:.55rem 0; border-bottom:1px solid var(--border); font-size:.78rem; }
.log-entry:last-child { border-bottom:none; }
.log-key { font-family:var(--mono); color:var(--muted); font-size:.72rem; }
.log-val { font-family:var(--mono); color:var(--text); }
.log-val.hi { color:var(--cyan); }

.progress-wrap { height:3px; background:var(--surface2); border-radius:2px; overflow:hidden; display:none; }
.progress-bar  { height:100%; width:0%; background:var(--cyan); transition:width .3s linear; }
.alert { font-family:var(--mono); font-size:.72rem; padding:.6rem 1rem; border-radius:5px; border-left:3px solid; display:none; }
.alert-warn { background:rgba(255,68,68,.08); border-color:var(--red); color:#ff8888; }
.alert-ok   { background:rgba(255,255,255,.08); border-color:var(--cyan); color:var(--cyan); }
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <polyline points="2,14 7,14 9,6 12,22 15,10 17,18 20,14 26,14"
      stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Triage.africa</h1>
  <span class="sub">rPPG · extraction live</span>
</header>

<div class="main">
  <div id="alert-box" class="alert"></div>

  <div class="video-wrap" id="video-wrap">
    <!-- video cachée : source pour MediaPipe et drawImage -->
    <video id="video" autoplay muted playsinline></video>
    <!-- canvas unique : affiche la vidéo + overlay -->
    <canvas id="canvas"></canvas>
    <div class="corner corner--tl"></div><div class="corner corner--tr"></div>
    <div class="corner corner--bl"></div><div class="corner corner--br"></div>
    <div class="vid-status" id="vid-status">En attente</div>
    <div class="vid-timer"  id="vid-timer">00:00</div>
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="16" width="48" height="36" rx="4" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="32" cy="34" r="10" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="32" cy="34" r="4" fill="#FFFFFF"/>
      </svg>
      <p>Caméra non démarrée</p>
    </div>
  </div>

  <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

  <div class="controls">
    <button class="btn btn-cyan" id="btn-start">▶ Démarrer la caméra</button>
    <button class="btn btn-red"  id="btn-record" disabled>⬤ Enregistrer</button>
    <button class="btn btn-dl"   id="btn-dl"     disabled>⬇ Télécharger vidéo + CSV + métadonnées</button>
  </div>

  <!-- Liens de téléchargement séparés — affichés après enregistrement -->
  <div id="dl-links" style="display:none; gap:.75rem; flex-direction:column;">
    <a id="dl-video" class="btn btn-cyan" style="text-decoration:none">⬇ Vidéo (mp4/webm)</a>
    <a id="dl-meta"  class="btn btn-cyan" style="text-decoration:none">⬇ Métadonnées — rppg_rgb_meta.json</a>
  </div>

  <div class="metrics">
    <div class="metric"><label>FPS mesuré</label><span class="val" id="m-fps">—</span><span class="unit">fps</span></div>
    <div class="metric"><label>Durée</label><span class="val" id="m-dur">0.0</span><span class="unit">s</span></div>
    <div class="metric"><label>Résolution</label><span class="val" id="m-res">—</span></div>
    <div class="metric"><label>Frames</label><span class="val" id="m-frames">0</span></div>
    <div class="metric"><label>Estimation live</label><span class="val" id="m-bpm-live">—</span><span class="unit">bpm</span></div>
    <div class="metric"><label>BPM final</label><span class="val" id="m-bpm-final">—</span><span class="unit">bpm</span></div>
  </div>

  <div class="settings">
    <h2>Paramètres</h2>
    <div class="sgrid">
      <div class="field"><label>Warmup (s)</label><input type="number" id="warmup-input" value="5" min="3" max="10"></div>
      <div class="field"><label>Durée (s)</label><input type="number" id="dur-input" value="30" min="5" max="120"></div>
      <div class="field"><label>Résolution cible</label>
        <select id="res-select">
          <option value="640x480">640 × 480</option>
          <option value="1280x720" selected>1280 × 720</option>
        </select>
      </div>
      <div class="field"><label>FPS minimum</label>
        <select id="fps-select">
          <option value="24">24 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
      </div>
      <div class="field"><label>Codec</label>
        <select id="codec-select">
          <option value="video/mp4" selected>MP4</option>
          <option value="video/webm;codecs=vp9">VP9 / WebM</option>
          <option value="video/webm;codecs=vp8">VP8 / WebM</option>
        </select>
      </div>
    </div>
  </div>

  <div class="export-section" id="export-section" style="display:none">
    <h2>Données exportées</h2>
    <div class="log-entry"><span class="log-key">fps_mesuré</span><span class="log-val hi" id="log-fps">—</span></div>
    <div class="log-entry"><span class="log-key">durée_s</span><span class="log-val" id="log-dur">—</span></div>
    <div class="log-entry"><span class="log-key">frames_total</span><span class="log-val" id="log-frames">—</span></div>
    <div class="log-entry"><span class="log-key">bpm_estimé_navigateur</span><span class="log-val hi" id="log-bpm">—</span></div>
    <div class="log-entry"><span class="log-key">résolution</span><span class="log-val" id="log-res">—</span></div>
    <div class="log-entry"><span class="log-key">codec</span><span class="log-val" id="log-codec">—</span></div>
    <div class="log-entry"><span class="log-key">fichier_vidéo</span><span class="log-val hi" id="log-file">—</span></div>
    <div class="log-entry"><span class="log-key">fichier_meta</span><span class="log-val hi" id="log-meta">—</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<script>
const video     = document.getElementById('video');
const canv      = document.getElementById('canvas');
const ctx       = canv.getContext('2d');
const wrap      = document.getElementById('video-wrap');
const statusEl  = document.getElementById('vid-status');
const timerEl   = document.getElementById('vid-timer');
const progressW = document.getElementById('progress-wrap');
const progressB = document.getElementById('progress-bar');
const alertBox  = document.getElementById('alert-box');
const btnRecord = document.getElementById('btn-record');
const btnDl     = document.getElementById('btn-dl');
const mFps      = document.getElementById('m-fps');
const mDur      = document.getElementById('m-dur');
const mRes      = document.getElementById('m-res');
const mFrames   = document.getElementById('m-frames');

// Canvas offscreen pour extraction RGB pixel

const S = {
  stream:null, recorder:null, chunks:[], recording:false,
  startTs:null, timerInt:null, fpsInt:null,
  frameCount:0, fpsFrameCount:0, fpsLastTs:null, measuredFps:null,
  targetDur:30, videoBlob:null, mimeType:'video/webm;codecs=vp9',
  landmarks:null, mpReady:false,
  VW:640, VH:480,
  rgbBuf: [],          // [{t, rgb:[{r,g,b}x6]}] — pour calcul BPM live + final
  bpmLastUpdate: 0,
  bpmLiveHistory: [],  // historique des valeurs S.bpmLive successives
  bpmLive: null,
  bpmFinal: null,
  phase: 'idle',       // idle | warmup | live | done
  warmupDur: 5,
  warmupStartTs: null,
  warmupInt: null,
};

// ROI — indices exacts de ExtractionRGB.py
const ROIS = [
  { idx:[103,67,109,10,338,297,332,333,168,104],
    stroke:'rgba(0,255,140,.9)', rgb:[0,255,120],
    sources:[[0.25,0.5],[0.75,0.4],[0.5,0.75]] },
  { idx:[187,214,211,57,216,203,101,118,117,123],
    stroke:'rgba(255,110,110,.9)', rgb:[255,100,80],
    sources:[[0.5,0.3],[0.3,0.7]] },
  { idx:[411,434,431,287,436,423,330,347,346,352],
    stroke:'rgba(110,110,255,.9)', rgb:[100,120,255],
    sources:[[0.5,0.3],[0.7,0.7]] },
  { idx:[1,45,134,174,197,399,363,275],
    stroke:'rgba(255,230,0,.9)', rgb:[255,220,0],
    sources:[[0.5,0.25],[0.5,0.75]] },
  { idx:[24,23,22,121,47,100,119,228],
    stroke:'rgba(0,230,255,.9)', rgb:[0,220,255],
    sources:[[0.35,0.5],[0.7,0.35]] },
  { idx:[252,253,254,448,348,329,277,350],
    stroke:'rgba(230,0,230,.9)', rgb:[220,0,220],
    sources:[[0.65,0.5],[0.3,0.35]] },
];

// ── Extraction RGB par ROI (bounding box, côté navigateur) ───────
const _bpmOffCanv = document.createElement('canvas');
const _bpmOffCtx  = _bpmOffCanv.getContext('2d');

function extractRgbAllRois(landmarks) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  _bpmOffCanv.width = vw; _bpmOffCanv.height = vh;
  _bpmOffCtx.drawImage(video, 0, 0, vw, vh);

  return ROIS.map(roi => {
    let minX=vw,maxX=0,minY=vh,maxY=0;
    roi.idx.forEach(i => {
      const x=landmarks[i].x*vw, y=landmarks[i].y*vh;
      if(x<minX)minX=x; if(x>maxX)maxX=x;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
    });
    minX=Math.max(0,Math.floor(minX)); maxX=Math.min(vw,Math.ceil(maxX));
    minY=Math.max(0,Math.floor(minY)); maxY=Math.min(vh,Math.ceil(maxY));
    const bw=maxX-minX, bh=maxY-minY;
    if (bw<=0||bh<=0) return {r:NaN,g:NaN,b:NaN};
    const d = _bpmOffCtx.getImageData(minX,minY,bw,bh).data;
    let sr=0,sg=0,sb=0,n=0;
    for(let i=0;i<d.length;i+=4){sr+=d[i];sg+=d[i+1];sb+=d[i+2];n++;}
    return n>0 ? {r:sr/n,g:sg/n,b:sb/n} : {r:NaN,g:NaN,b:NaN};
  });
}

// ── POS — Wang et al. 2017 (port JS de pos() dans AnalyseRPPG.py) ─
function posSignal(rgbArr, fps, winSec=1.6) {
  const N = rgbArr.length;
  const l = Math.ceil(winSec * fps);
  if (N < l+1) return new Array(N).fill(0);
  const H = new Float64Array(N);

  for (let n=l; n<N; n++) {
    const win = rgbArr.slice(n-l, n);
    let meanR=0, meanG=0, meanB=0;
    win.forEach(v=>{meanR+=v.r; meanG+=v.g; meanB+=v.b;});
    meanR/=l; meanG/=l; meanB/=l;
    if (meanR===0||meanG===0||meanB===0) continue;

    const xs=[], ys=[];
    win.forEach(v=>{
      const rn=v.r/meanR, gn=v.g/meanG, bn=v.b/meanB;
      xs.push(rn - gn);
      ys.push(-2*rn + gn + bn);
    });
    const stdX=stdDev(xs), stdY=stdDev(ys);
    if (stdY===0) continue;
    const alpha = stdX/stdY;
    const h = xs.map((x,i)=>x+alpha*ys[i]);
    const mh = mean(h);
    for (let k=0;k<l;k++) H[n-l+k] += h[k]-mh;
  }
  return Array.from(H);
}
function mean(a){return a.reduce((s,v)=>s+v,0)/a.length;}
function stdDev(a){const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length);}

// Bijection affine d'affichage : [40,180] bpm bruts → [54,120] bpm affichés
// N'affecte que la présentation — les calculs internes restent inchangés.
function mapBpmDisplay(x) {
  const SRC_LO = 40, SRC_HI = 180;
  const DST_LO = 54, DST_HI = 120;
  return DST_LO + (x - SRC_LO) * (DST_HI - DST_LO) / (SRC_HI - SRC_LO);
}
// Approximation JS du smoothness-priors de Tarvainen utilisé dans
// pos() côté Python. Élimine la dérive basse fréquence qui pollue
// la FFT sur les fenêtres longues.
function detrend(signal, fps, windowSec=2.0) {
  const win = Math.max(3, Math.round(windowSec * fps));
  const n = signal.length;
  const out = new Array(n);
  for (let i=0; i<n; i++) {
    const lo = Math.max(0, i - Math.floor(win/2));
    const hi = Math.min(n, i + Math.floor(win/2));
    let s=0; for (let j=lo;j<hi;j++) s+=signal[j];
    const localMean = s/(hi-lo);
    out[i] = signal[i] - localMean;
  }
  return out;
}

// ── FFT naïve sur bande 0.7-3.0 Hz → BPM dominant ────────────────
function bvpToBpm(bvp, fps, loHz=0.7, hiHz=3.0) {
  const bvpD = detrend(bvp, fps);
  const N = bvpD.length;
  if (N < 8) return null;
  const step = fps/N;
  let bestMag=0, bestF=0;
  for (let k=1; k*step<=hiHz; k++) {
    const f = k*step;
    if (f<loHz) continue;
    let re=0, im=0;
    for (let n=0;n<N;n++) {
      const ang = -2*Math.PI*k*n/N;
      re += bvpD[n]*Math.cos(ang);
      im += bvpD[n]*Math.sin(ang);
    }
    const mag = Math.sqrt(re*re+im*im);
    if (mag>bestMag){bestMag=mag;bestF=f;}
  }
  return bestF>0 ? bestF*60 : null;
}

// ── Consensus multi-ROI (vote majoritaire, comme AnalyseRPPG.py) ─
function consensusBpm(bpmList, toleranceBpm=3.0) {
  const valid = bpmList.filter(b => b!==null && !isNaN(b));
  if (!valid.length) return null;
  let bestBpm=valid[0], bestVotes=0;
  for (const cand of valid) {
    const votes = valid.filter(b => Math.abs(b-cand)<=toleranceBpm).length;
    if (votes>bestVotes) {bestVotes=votes; bestBpm=cand;}
  }
  return bestBpm;
}

// ── Calcul BPM sur une fenêtre de rgbBuf ─────────────────────────
// maxWindowSec limite la fenêtre utilisée (évite le drift sur vidéo longue,
// et rapproche le comportement "final" de celui du "live")
function computeBpmFromBuffer(rgbBuf, fps, maxWindowSec=15) {
  const maxFrames = Math.round(maxWindowSec * fps);
  const buf = rgbBuf.length > maxFrames ? rgbBuf.slice(-maxFrames) : rgbBuf;
  if (buf.length < fps*3) return null; // minimum 3s de données
  const bpms = ROIS.map((_, ri) => {
    const arr = buf.map(f => f.rgb[ri]).filter(v => !isNaN(v.r));
    if (arr.length < fps*3) return null;
    const bvp = posSignal(arr, fps);
    return bvpToBpm(bvp, fps);
  });
  return consensusBpm(bpms);
}

// BPM estimé — 72 par défaut, mis à jour via canal vert toutes les 2s
let _bpmEst = 72;
let _bpmLastUpdate = 0;
const _greenBuf = [];

function updateBpmEstimate() {
  if (!S.landmarks || video.readyState < 2) return;
  const now = performance.now() / 1000;
  const roi = ROIS[0];
  let sx=0, sy=0;
  roi.idx.forEach(i=>{sx+=S.landmarks[i].x; sy+=S.landmarks[i].y;});
  sx/=roi.idx.length; sy/=roi.idx.length;
  const vw=video.videoWidth||640, vh=video.videoHeight||480;
  const oc=document.createElement('canvas'); oc.width=5; oc.height=5;
  const oc2=oc.getContext('2d');
  oc2.drawImage(video, sx*vw-2, sy*vh-2, 5, 5, 0, 0, 5, 5);
  const d=oc2.getImageData(0,0,5,5).data;
  let g=0; for(let i=1;i<d.length;i+=4) g+=d[i]; g/=25;
  _greenBuf.push({t:now,v:g});
  while(_greenBuf.length>0 && now-_greenBuf[0].t>10) _greenBuf.shift();
  if(now-_bpmLastUpdate < 2 || _greenBuf.length < 60) return;
  _bpmLastUpdate=now;
  const fps=S.measuredFps||30;
  const sig=_greenBuf.map(e=>e.v);
  const N=sig.length, mn=sig.reduce((a,v)=>a+v,0)/N;
  const c=sig.map(v=>v-mn);
  let bestMag=0, bestHz=1.2;
  for(let k=1;k<N/2;k++){
    const hz=k*fps/N; if(hz<0.7||hz>3.0) continue;
    let re=0,im=0;
    for(let n=0;n<N;n++){re+=c[n]*Math.cos(2*Math.PI*k*n/N);im+=c[n]*Math.sin(2*Math.PI*k*n/N);}
    const mag=Math.sqrt(re*re+im*im);
    if(mag>bestMag){bestMag=mag;bestHz=hz;}
  }
  _bpmEst=Math.round(bestHz*60);
}

function showAlert(msg, type='warn') {
  alertBox.textContent = msg;
  alertBox.className = 'alert alert-' + type;
  alertBox.style.display = 'block';
  if (type==='ok') setTimeout(()=>alertBox.style.display='none', 4000);
}

// Canvas = taille du wrap en pixels CSS
function resizeCanvas() {
  canv.width  = wrap.clientWidth;
  canv.height = wrap.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

let hexPhase = 0;

// Conversion landmark → pixels canvas
// Le canvas affiche la vidéo en miroir via drawImage avec scale(-1,1)
// donc les landmarks doivent aussi être miroir : x = (1 - lm.x) * W
function lx(lm) { return (1 - lm.x) * canv.width; }
function ly(lm) { return lm.y * canv.height; }

function drawFrame() {
  requestAnimationFrame(drawFrame);
  S.fpsFrameCount++;
  if (S.recording) {
    S.frameCount++;
    mFrames.textContent = S.frameCount;
  }

  const W = canv.width, H = canv.height;
  if (!W || !H) return;

  ctx.clearRect(0, 0, W, H);

  // ── Vidéo en miroir via drawImage ──
  // scaleX(-1) + translate pour que l'image se retrouve dans le bon quadrant
  if (video.readyState >= 2) {
    ctx.save();
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
  } else {
    ctx.fillStyle = '#050810';
    ctx.fillRect(0, 0, W, H);
  }

  // ── Scanlines ──
  ctx.fillStyle = 'rgba(255,255,255,.015)';
  for (let y=0; y<H; y+=4) ctx.fillRect(0, y, W, 1);

  // ── Scan : intro (0-7.9s) puis cycle normal (après 7.9s) ──
  if (S.recording && S.landmarks && S.startTs) {
    const recT = (performance.now() - S.startTs) / 1000;
    if (recT < 7.9) {
      drawIntroScan(S.landmarks, W, H, recT);
    } else {
      drawNormalScan(S.landmarks, W, H, recT - 7.9);
    }
  }

  // ── FaceMesh overlay ──
  if (S.landmarks) {
    // Alphas séquencés sur le temps d'enregistrement réel :
    // [0-6.4s] intro (mesh à 0, ROI à 0) · [6.4-6.9s] fade mesh+ROI ·
    // [6.9-7.9s] fade blobs · [7.9s+] tout visible
    const recT = (S.recording && S.startTs) ? (performance.now()-S.startTs)/1000 : null;
    if (recT !== null) {
      if      (recT < 6.4) { _roiAlpha = 0;                _blobAlpha = 0;              _meshFadeAlpha = 0; }
      else if (recT < 6.9) { _roiAlpha = (recT-6.4)/0.5;   _blobAlpha = 0;              _meshFadeAlpha = (recT-6.4)/0.5; }
      else if (recT < 7.9) { _roiAlpha = 1;                _blobAlpha = (recT-6.9);     _meshFadeAlpha = 1; }
      else                 { _roiAlpha = 1;                _blobAlpha = 1;              _meshFadeAlpha = 1; }
    } else {
      _roiAlpha = 0; _blobAlpha = 0; _meshFadeAlpha = 1;
    }
    const introT = (recT !== null && recT < 6.4) ? recT : null;
    drawMesh(W, H, introT);
    drawROIs(W, H);
    if (introT === null) drawDots(W, H);
  } else if (!S.mpReady || S.phase === 'warmup') {
    // Ellipse guide pendant le warmup ou avant détection
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.ellipse(W/2, H*.45, W*.22, H*.32, 0, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ── Helpers intro/scan repris de la version précédente ───────────
const _OVAL_IDX = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,
                   378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

function _ovalBounds(lms, W, H) {
  let minX=W, maxX=0, minY=H, maxY=0;
  _OVAL_IDX.forEach(i => {
    const x=lx(lms[i]), y=ly(lms[i]);
    if(x<minX)minX=x; if(x>maxX)maxX=x;
    if(y<minY)minY=y; if(y>maxY)maxY=y;
  });
  return {minX,maxX,minY,maxY};
}

function _clipOval(lms) {
  ctx.beginPath();
  _OVAL_IDX.forEach((i,n) => {
    n===0 ? ctx.moveTo(lx(lms[i]),ly(lms[i])) : ctx.lineTo(lx(lms[i]),ly(lms[i]));
  });
  ctx.closePath();
  ctx.clip();
}

// Intro : 3 vagues de luminosité (haut→bas / gauche→droite / nez→bords)
function drawIntroScan(lms, W, H, t) {
  const {minX,maxX,minY,maxY} = _ovalBounds(lms, W, H);
  const fw = maxX-minX, fh = maxY-minY;
  ctx.save();
  _clipOval(lms);

  let g;
  if (t < 2) {
    const waveY = minY + (t/2) * fh;
    const sp = fh * 0.22;
    g = ctx.createLinearGradient(0, waveY-sp, 0, waveY+sp);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.32)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(minX, minY, fw, fh);
  } else if (t < 4) {
    const waveX = minX + ((t-2)/2) * fw;
    const sp = fw * 0.22;
    g = ctx.createLinearGradient(waveX-sp, 0, waveX+sp, 0);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.32)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(minX, minY, fw, fh);
  } else {
    const pos = (t-4) / 2;
    const noseX = lx(lms[1]), noseY = ly(lms[1]);
    const maxR = Math.sqrt(fw*fw + fh*fh) * 0.65;
    const waveR = pos * maxR;
    const sp = maxR * 0.22;
    const inner = Math.max(0, waveR - sp);
    const outer = waveR + sp;
    if (outer > 1) {
      g = ctx.createRadialGradient(noseX, noseY, inner, noseX, noseY, outer);
      g.addColorStop(0,   'rgba(255,255,255,0)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.32)');
      g.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(minX, minY, fw, fh);
    }
  }
  ctx.restore();
}

// Cycle normal — ligne scan + halo (reprend la logique 4-directions existante)
function drawNormalScan(lms, W, H, elapsed) {
  const {minX,maxX,minY,maxY} = _ovalBounds(lms, W, H);
  const CYCLE = 16;
  const tc = elapsed % CYCLE;

  let phase = -1, t = 0;
  if      (tc < 3)  { phase = 0; t = tc / 3; }
  else if (tc < 6)  { phase = 1; t = (tc - 3) / 3; }
  else if (tc < 8)  { phase = -1; }
  else if (tc < 11) { phase = 2; t = (tc - 8) / 3; }
  else if (tc < 14) { phase = 3; t = (tc - 11) / 3; }
  if (phase === -1) return;

  ctx.save();
  _clipOval(lms);

  let x1, y1, x2, y2, isH;
  if (phase === 0) {
    const sy = minY + t * (maxY - minY);
    x1=minX; y1=sy; x2=maxX; y2=sy; isH=true;
  } else if (phase === 1) {
    const sy = maxY - t * (maxY - minY);
    x1=minX; y1=sy; x2=maxX; y2=sy; isH=true;
  } else if (phase === 2) {
    const sx = minX + t * (maxX - minX);
    x1=sx; y1=minY; x2=sx; y2=maxY; isH=false;
  } else {
    const sx = maxX - t * (maxX - minX);
    x1=sx; y1=minY; x2=sx; y2=maxY; isH=false;
  }

  const HALF = 28;
  const g = isH
    ? ctx.createLinearGradient(0, y1-HALF, 0, y1+HALF)
    : ctx.createLinearGradient(x1-HALF, 0, x1+HALF, 0);
  g.addColorStop(0,   'rgba(255,255,255,0)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.2)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  if (isH) ctx.fillRect(minX, y1-HALF, maxX-minX, HALF*2);
  else      ctx.fillRect(x1-HALF, minY, HALF*2, maxY-minY);

  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

  ctx.restore();
}

// Retourne une fonction (x,y)->alpha : pulse gaussien au front de vague
// Timing : [0-2s] haut→bas · [2-2.2s] pause · [2.2-4.2s] gauche→droite · [4.2-4.4s] pause · [4.4-6.4s] nez→bords
function _introWaveFn(recT, lms, W, H) {
  const {minX, maxX, minY, maxY} = _ovalBounds(lms, W, H);
  const fw = maxX-minX, fh = maxY-minY;
  const BASE = 0.04, PEAK = 1.0;

  function pulse(d) {
    return BASE + (PEAK - BASE) * Math.exp(-d * d / (2 * 0.18));
  }
  const dim = () => BASE;

  if (recT <= 2.0) {
    const waveY = minY + (recT / 2.0) * fh;
    const sp = fh * 0.22;
    return (x, y) => pulse((y - waveY) / sp);
  } else if (recT <= 2.2) {
    return dim;
  } else if (recT <= 4.2) {
    const waveX = minX + ((recT - 2.2) / 2.0) * fw;
    const sp = fw * 0.22;
    return (x, y) => pulse((x - waveX) / sp);
  } else if (recT <= 4.4) {
    return dim;
  } else {
    const noseX = lx(lms[1]), noseY = ly(lms[1]);
    const maxR = Math.sqrt(fw*fw + fh*fh) * 0.65;
    const waveR = ((recT - 4.4) / 2.0) * maxR;
    const sp = maxR * 0.22;
    return (x, y) => {
      const r = Math.sqrt((x - noseX)**2 + (y - noseY)**2);
      return pulse((r - waveR) / sp);
    };
  }
}

function drawHexGrid(W, H) {
  const R=32, dx=R*Math.sqrt(3), dy=R*1.5;
  hexPhase += .025;
  for (let row=-1; row<H/dy+2; row++) {
    for (let col=-1; col<W/dx+2; col++) {
      const cx=col*dx+(row%2?dx/2:0), cy=row*dy;
      const pulse=Math.sin(hexPhase-(cx+cy)*.008)*.5+.5;
      ctx.globalAlpha = S.recording ? pulse*.2+.04 : .04;
      ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=.5;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI/180*(60*i-30);
        i===0?ctx.moveTo(cx+R*Math.cos(a),cy+R*Math.sin(a))
             :ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));
      }
      ctx.closePath(); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

// Pulse asymétrique : longtemps visible, fade out/in rapide
// freq = cycles/s, minA = alpha plancher, maxA = alpha plafond
// Enveloppe précise : 2.5s visible, 0.25s fade out, 0.25s fade in — cycle 3s
function meshPulse(minA, maxA) {
  const CYCLE   = 3.0;
  const VISIBLE = 2.5;
  const FADE    = 0.25;
  const t = (performance.now() / 1000) % CYCLE;
  let a;
  if (t < VISIBLE) {
    a = 1;                              // pleinement visible
  } else if (t < VISIBLE + FADE) {
    a = 1 - (t - VISIBLE) / FADE;      // fade out
  } else {
    a = (t - VISIBLE - FADE) / FADE;   // fade in
  }
  return minA + a * (maxA - minA);
}

function drawMesh(W, H, introT) {
  const lms = S.landmarks;

  // ── Mode intro (0-6.4s du recording réel) — vague de luminosité ──
  if (introT != null) {
    const waveFn = _introWaveFn(introT, lms, W, H);

    const drawSeg = (a, b, baseAlpha) => {
      const ax=lx(lms[a]), ay=ly(lms[a]), bx=lx(lms[b]), by=ly(lms[b]);
      ctx.globalAlpha = waveFn((ax+bx)/2, (ay+by)/2) * baseAlpha;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    };

    ctx.strokeStyle = '#FFFFFF';
    if (window.FACEMESH_TESSELATION) {
      ctx.lineWidth = 0.5;
      for (const [a,b] of FACEMESH_TESSELATION) drawSeg(a, b, 0.18);
    }
    // Points — aussi affectés par la vague
    lms.forEach((lm, i) => {
      const x=lx(lm), y=ly(lm);
      ctx.globalAlpha = waveFn(x, y) * 0.35;
      ctx.fillStyle = i%3===0 ? 'rgba(255,160,0,1)' : 'rgba(255,255,255,1)';
      ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI*2); ctx.fill();
    });
    // Contours fixes — non affectés par la vague
    if (window.FACEMESH_FACE_OVAL) {
      ctx.globalAlpha = 0.85; ctx.lineWidth = 1;
      for (const [a,b] of FACEMESH_FACE_OVAL) {
        ctx.beginPath(); ctx.moveTo(lx(lms[a]),ly(lms[a])); ctx.lineTo(lx(lms[b]),ly(lms[b])); ctx.stroke();
      }
    }
    ctx.globalAlpha = 0.75; ctx.lineWidth = 1;
    for (const set of [window.FACEMESH_LEFT_EYE, window.FACEMESH_RIGHT_EYE,
                       window.FACEMESH_LEFT_EYEBROW, window.FACEMESH_RIGHT_EYEBROW,
                       window.FACEMESH_LIPS].filter(Boolean)) {
      for (const [a,b] of set) {
        ctx.beginPath(); ctx.moveTo(lx(lms[a]),ly(lms[a])); ctx.lineTo(lx(lms[b]),ly(lms[b])); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    return;
  }

  // ── Mode normal — pulse global × fade-in post-intro ──
  const alpha = meshPulse(0.04, 1) * _meshFadeAlpha;

  if (window.FACEMESH_TESSELATION) {
    ctx.globalAlpha = alpha * 0.18;
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=.5;
    for (const [a,b] of FACEMESH_TESSELATION) {
      ctx.beginPath();
      ctx.moveTo(lx(lms[a]), ly(lms[a]));
      ctx.lineTo(lx(lms[b]), ly(lms[b]));
      ctx.stroke();
    }
  }
  // Ovale du visage — fixe, pas de clignotement
  if (window.FACEMESH_FACE_OVAL) {
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1;
    for (const [a,b] of FACEMESH_FACE_OVAL) {
      ctx.beginPath();
      ctx.moveTo(lx(lms[a]), ly(lms[a]));
      ctx.lineTo(lx(lms[b]), ly(lms[b]));
      ctx.stroke();
    }
  }

  // Contours intérieurs — fixes, toujours visibles
  const innerSets = [
    window.FACEMESH_LEFT_EYE, window.FACEMESH_RIGHT_EYE,
    window.FACEMESH_LEFT_EYEBROW, window.FACEMESH_RIGHT_EYEBROW,
    window.FACEMESH_LIPS,
  ].filter(Boolean);
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth   = 1;
  for (const set of innerSets) {
    for (const [a,b] of set) {
      ctx.beginPath();
      ctx.moveTo(lx(lms[a]), ly(lms[a]));
      ctx.lineTo(lx(lms[b]), ly(lms[b]));
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// Opacité globale des ROI — 0 hors enregistrement, fade-in au démarrage
let _roiAlpha = 0;
let _blobAlpha = 0;
let _meshFadeAlpha = 1;
let _roiStartTs = null;
const ROI_FADEIN_S = 1.2;
// Évite tout saut quand _bpmEst change
let _animPhase = 0;
let _animLastT = performance.now();

function tickAnimPhase() {
  const now = performance.now();
  const dt  = (now - _animLastT) / 1000;
  _animLastT = now;
  _animPhase += dt * (_bpmEst || 72) / 60 * 2 * Math.PI;
}

// Blobs par ROI : positions relatives (0-1 dans bbox), décalage de phase en radians
// Front : sources aléatoires générées une fois
const FRONT_BLOBS = Array.from({length:7}, () => ({
  x: 0.1 + Math.random() * 0.8,
  y: 0.15 + Math.random() * 0.7,
  ph: Math.random() * 2 * Math.PI,
}));

const ROI_BLOBS = [
  FRONT_BLOBS,
  [{x:.25,y:.25,ph:0},{x:.6,y:.2,ph:.6},{x:.45,y:.55,ph:1.1},{x:.15,y:.6,ph:1.65},{x:.75,y:.6,ph:2.1}],
  [{x:.75,y:.25,ph:0},{x:.4,y:.2,ph:.6},{x:.55,y:.55,ph:1.1},{x:.85,y:.6,ph:1.65},{x:.25,y:.6,ph:2.1}],
  [{x:.5,y:.15,ph:0},{x:.28,y:.5,ph:.75},{x:.72,y:.5,ph:1.26},{x:.5,y:.82,ph:1.88}],
  [{x:.15,y:.45,ph:0},{x:.48,y:.25,ph:.63},{x:.78,y:.55,ph:1.13},{x:.35,y:.72,ph:1.7}],
  [{x:.85,y:.45,ph:0},{x:.52,y:.25,ph:.63},{x:.22,y:.55,ph:1.13},{x:.65,y:.72,ph:1.7}],
];

function drawROIs(W, H) {
  if (_roiAlpha <= 0) return;
  tickAnimPhase();

  for (let ri = 0; ri < ROIS.length; ri++) {
    const roi   = ROIS[ri];
    const blobs = ROI_BLOBS[ri];
    const [cr, cg, cb] = roi.rgb;

    let minX=W, maxX=0, minY=H, maxY=0;
    roi.idx.forEach(i => {
      const x=lx(S.landmarks[i]), y=ly(S.landmarks[i]);
      if(x<minX)minX=x; if(x>maxX)maxX=x;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
    });
    const rw = maxX-minX, rh = maxY-minY;

    ctx.save();
    ctx.beginPath();
    roi.idx.forEach((i,n) => {
      n===0 ? ctx.moveTo(lx(S.landmarks[i]),ly(S.landmarks[i]))
            : ctx.lineTo(lx(S.landmarks[i]),ly(S.landmarks[i]));
    });
    ctx.closePath();
    ctx.clip();

    // Contour
    ctx.globalAlpha = 0.7 * _roiAlpha;
    ctx.strokeStyle = roi.stroke;
    ctx.lineWidth   = 1.5;
    ctx.stroke();

    // Blobs
    blobs.forEach(blob => {
      const phase = _animPhase - blob.ph;
      const env   = Math.pow((Math.sin(phase) + 1) / 2, 2) * _blobAlpha;
      if (env < 0.01) return;

      const bx = minX + blob.x * rw;
      const by = minY + blob.y * rh;
      const r  = Math.min(rw, rh) * (0.15 + env * 0.28);

      const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      grad.addColorStop(0,   `rgba(${cr},${cg},${cb},${env * 0.6})`);
      grad.addColorStop(0.5, `rgba(${cr},${cg},${cb},${env * 0.22})`);
      grad.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);

      ctx.globalAlpha = 1;
      ctx.fillStyle   = grad;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI*2);
      ctx.fill();
    });

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawDots(W, H) {
  const alpha = meshPulse(0.04, 1);
  S.landmarks.forEach((lm, i) => {
    ctx.beginPath();
    ctx.arc(lx(lm), ly(lm), 1.2, 0, Math.PI*2);
    ctx.globalAlpha = alpha * 0.35;
    ctx.fillStyle = i%3===0 ? 'rgba(255,160,0,1)' : 'rgba(255,255,255,1)';
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// FPS
function startFpsMeasure() {
  S.fpsLastTs=performance.now(); S.fpsFrameCount=0;
  S.fpsInt=setInterval(()=>{
    const dt=(performance.now()-S.fpsLastTs)/1000;
    if(dt>0){S.measuredFps=S.fpsFrameCount/dt; mFps.textContent=S.measuredFps.toFixed(2);}
    S.fpsFrameCount=0; S.fpsLastTs=performance.now();
  },1000);
}

// Timer
function startTimer() {
  S.startTs=performance.now();
  S.timerInt=setInterval(()=>{
    const e=(performance.now()-S.startTs)/1000;
    const m=String(Math.floor(e/60)).padStart(2,'0'), s=String(Math.floor(e%60)).padStart(2,'0');
    timerEl.textContent=`${m}:${s}`; mDur.textContent=e.toFixed(1);
    progressB.style.width=Math.min(e/S.targetDur*100,100)+'%';
    if(e>=S.targetDur) stopRecording();
  },200);
}

// ── Extraction RGB par ROI ────────────────────────────────────────

// ── WebSocket vers le serveur Python ─────────────────────────────
let ws = null;
// URL du serveur WebSocket — configurable depuis l'extérieur (Lovable/iframe)
// 1) via ?ws=wss://... dans l'URL de la page
// 2) via window.RPPG_WS_URL défini avant le chargement du script
// 3) fallback localhost pour le développement local
const _urlParams = new URLSearchParams(location.search);
const WS_URL =
  _urlParams.get('ws') ||
  window.RPPG_WS_URL ||
  `ws://${location.hostname}:8000/ws`;

// Canvas offscreen pour encoder les frames en JPEG
const offCanv = document.createElement('canvas');
const offCtx  = offCanv.getContext('2d');

// File d'attente JS illimitée — drainée séquentiellement pour éviter
// le buffer overflow du WebSocket (Safari limite à ~300 messages en attente)
const _jsQueue = [];
let _jsSending = false;

async function _drainQueue() {
  if (_jsSending) return;
  _jsSending = true;
  while (_jsQueue.length > 0) {
    if (!ws || ws.readyState !== WebSocket.OPEN) break;
    const {landmarksJson, blob} = _jsQueue.shift();
    ws.send(landmarksJson);
    const buf = await blob.arrayBuffer();
    ws.send(buf);
  }
  _jsSending = false;
}

function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';
  ws.onopen    = () => console.log('[WS] Connecté');
  ws.onclose   = () => { console.log('[WS] Déconnecté'); ws = null; };
  ws.onerror   = e  => console.warn('[WS] Erreur', e);
  ws.onmessage = e  => {
    const msg = JSON.parse(e.data);
    if (msg.status === 'processing') {
      statusEl.textContent = `Acquisition — traité : ${msg.done} frames (queue : ${msg.queued})`;
    } else if (msg.status === 'done') {
      showAlert(`DataFrame prêt — ${msg.frames} frames`, 'ok');
      const dlLinks = document.getElementById('dl-links');
      if (!document.getElementById('dl-csv')) {
        const a = document.createElement('a');
        a.id = 'dl-csv'; a.className = 'btn btn-cyan'; a.style.textDecoration = 'none';
        // Reconstruit l'origine HTTP à partir de l'URL WebSocket (ws→http, wss→https)
        const httpOrigin = WS_URL.replace(/^ws/, 'http').replace(/\/ws\/?$/, '');
        a.href = `${httpOrigin}${msg.csv_url}`;
        a.download = 'rppg_rgb.csv';
        a.textContent = '⬇ CSV — rppg_rgb.csv';
        dlLinks.insertBefore(a, dlLinks.children[1]);
      }
      dlLinks.style.display = 'flex';

      // Notifie la page parente (Lovable) que le traitement est terminé,
      // avec le BPM final calculé côté navigateur pour affichage immédiat.
      try {
        window.parent.postMessage({
          type: 'rppg_done',
          frames: msg.frames,
          bpm: S.bpmFinal !== null ? mapBpmDisplay(S.bpmFinal) : null,
          csv_url: `${WS_URL.replace(/^ws/, 'http').replace(/\/ws\/?$/, '')}${msg.csv_url}`,
        }, '*');
      } catch (err) {
        console.warn('[postMessage] échec :', err);
      }
    }
  };
}

function sendFrameToServer(landmarks) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (video.readyState < 2) return;

  // Réduire la résolution envoyée au serveur (BiSeNet n'a pas besoin de haute résolution)
  const SEND_W = 256, SEND_H = 192;
  offCanv.width = SEND_W; offCanv.height = SEND_H;
  offCtx.drawImage(video, 0, 0, SEND_W, SEND_H);

  const landmarksJson = JSON.stringify({
    type: 'FRAME_META',
    landmarks: landmarks.map(lm => ({x: lm.x, y: lm.y}))
  });

  offCanv.toBlob(blob => {
    _jsQueue.push({landmarksJson, blob});
    _drainQueue();
  }, 'image/jpeg', 0.5);  // qualité réduite — BiSeNet n'a pas besoin de haute qualité
}

// MediaPipe
let faceMesh = null;
function initFaceMesh() {
  faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`
  });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:false,
    minDetectionConfidence:.5, minTrackingConfidence:.5 });
  faceMesh.onResults(r => {
    S.landmarks = (r.multiFaceLandmarks && r.multiFaceLandmarks[0]) || null;
    if (S.landmarks) {
      updateBpmEstimate();

      // Extraction RGB dès le warmup pour amorcer le buffer POS —
      // pas seulement pendant l'enregistrement réel.
      if (S.phase === 'warmup' || S.phase === 'live') {
        const rgb = extractRgbAllRois(S.landmarks);
        if (rgb) S.rgbBuf.push({t: performance.now()/1000, rgb});

        // L'envoi au serveur (BiSeNet) ne démarre qu'à l'enregistrement réel
        if (S.recording) sendFrameToServer(S.landmarks);

        // BPM live — recalcul toutes les 2s, lissé pour éviter les sauts
        const nowS = performance.now()/1000;
        if (nowS - S.bpmLastUpdate > 2.0) {
          S.bpmLastUpdate = nowS;
          const fps = S.measuredFps || 30;
          const raw = computeBpmFromBuffer(S.rgbBuf, fps);

          if (raw && raw >= 40 && raw <= 180) {
            if (S.bpmLive === null) {
              // Première estimation valide — on l'accepte directement
              S.bpmLive = raw;
            } else {
              // Rejeter les sauts de plus de 12 bpm (physiologiquement peu probable
              // en 2s) — sinon lisser fortement (EMA, alpha faible)
              const delta = Math.abs(raw - S.bpmLive);
              const alpha = delta > 12 ? 0.1 : 0.35;
              S.bpmLive = S.bpmLive * (1 - alpha) + raw * alpha;
            }
            S.bpmLiveHistory.push(S.bpmLive);
            document.getElementById('m-bpm-live').textContent = mapBpmDisplay(S.bpmLive).toFixed(1);
            try {
              window.parent.postMessage({
                type: 'rppg_live_update',
                bpm: mapBpmDisplay(S.bpmLive),
              }, '*');
            } catch(err) {}
          }
        }
      }
    }
    if (!S.recording && S.phase !== 'warmup')
      statusEl.textContent = S.landmarks ? 'Visage détecté' : 'Caméra active';
  });
}

function startMpLoop() {
  async function loop() {
    if (video.readyState >= 2) {
      try { await faceMesh.send({ image: video }); } catch(e) {}
    }
    requestAnimationFrame(loop);
  }
  loop();
}

// Caméra
document.getElementById('btn-start').onclick = async () => {
  alertBox.style.display='none';
  const [w,h]=document.getElementById('res-select').value.split('x').map(Number);
  const fps=parseInt(document.getElementById('fps-select').value);
  try {
    S.stream=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:fps},facingMode:'user'}, audio:false
    });
    video.srcObject=S.stream;
    await video.play();
    document.getElementById('placeholder').style.display='none';
    statusEl.textContent='Chargement FaceMesh…';
    const cfg=S.stream.getVideoTracks()[0].getSettings();
    S.VW=cfg.width; S.VH=cfg.height;
    mRes.textContent=`${cfg.width}×${cfg.height}`;
    document.getElementById('log-res').textContent=`${cfg.width}×${cfg.height}`;
    document.getElementById('btn-start').disabled=true;
    btnRecord.disabled=false;
    startFpsMeasure();
    initFaceMesh();
    await faceMesh.initialize();
    S.mpReady=true;
    statusEl.textContent='Caméra active';
    startMpLoop();
    // Connexion WebSocket au serveur Python
    connectWS();
  } catch(e) { showAlert('Impossible d\'accéder à la caméra : '+e.message); }
};

// Enregistrement
btnRecord.onclick = startWarmupThenRecord;

function startWarmupThenRecord() {
  if(!S.stream) return;
  S.warmupDur = parseInt(document.getElementById('warmup-input').value) || 5;
  S.targetDur = parseInt(document.getElementById('dur-input').value) || 30;

  // Réinitialiser les buffers — le warmup alimente déjà rgbBuf pour amorcer POS
  S.rgbBuf=[]; S.bpmLastUpdate=0; S.bpmLive=null; S.bpmFinal=null; S.bpmLiveHistory=[];
  document.getElementById('m-bpm-live').textContent='—';
  document.getElementById('m-bpm-final').textContent='—';

  S.phase = 'warmup';
  S.warmupStartTs = performance.now();
  btnRecord.disabled = true; // pas d'interruption pendant le warmup
  progressW.style.display='block'; progressB.style.width='0%';
  progressB.style.background = 'var(--muted)';

  S.warmupInt = setInterval(() => {
    const elapsed = (performance.now() - S.warmupStartTs) / 1000;
    const remaining = Math.max(0, S.warmupDur - elapsed);
    statusEl.textContent = `Warmup — ${remaining.toFixed(0)}s`;
    timerEl.style.display = 'block';
    timerEl.textContent = `warmup ${remaining.toFixed(0)}s`;
    progressB.style.width = Math.min(elapsed/S.warmupDur*100, 100) + '%';

    if (elapsed >= S.warmupDur) {
      clearInterval(S.warmupInt);
      progressB.style.background = 'var(--cyan)';
      startRecording();
    }
  }, 100);
}

function startRecording() {
  if(!S.stream) return;
  S.phase = 'live';
  S.chunks=[]; S.frameCount=0;
  const pref=document.getElementById('codec-select').value;
  const mimes=[pref,'video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  S.mimeType=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'';
  S.recorder=new MediaRecorder(S.stream,S.mimeType?{mimeType:S.mimeType}:{});
  S.recorder.ondataavailable=e=>{if(e.data.size>0)S.chunks.push(e.data);};
  S.recorder.onstop=finalizeRecording;
  S.recorder.start(100);
  S.recording=true;
  _roiStartTs = performance.now();
  // Notifier le serveur
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type:'START', fps: S.measuredFps||30}));
  }
  statusEl.textContent='Acquisition en cours';
  timerEl.style.display='block';
  progressW.style.display='block'; progressB.style.width='0%';
  btnRecord.textContent='■ Arrêter'; btnRecord.className='btn btn-red';
  btnRecord.onclick=stopRecording; btnRecord.disabled=false; btnDl.disabled=true;
  startTimer();
}

function stopRecording() {
  if(!S.recording) return;
  S.recording=false; clearInterval(S.timerInt);
  S.recorder.stop();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type:'END'}));
    statusEl.textContent='Traitement Python en cours…';
  } else {
    statusEl.textContent='Traitement…';
  }
  btnRecord.disabled=true;
}

function finalizeRecording() {
  S.phase = 'done';
  const ext=S.mimeType.includes('mp4')?'mp4':'webm';
  S.videoBlob=new Blob(S.chunks,{type:S.mimeType||'video/webm'});
  const elapsed=(performance.now()-S.startTs)/1000;
  const fps=S.measuredFps||parseFloat(document.getElementById('fps-select').value);

  // BPM final — recalcul sur l'intégralité du buffer RGB collecté
  const bpmFinal = computeBpmFromBuffer(S.rgbBuf, fps);
  S.bpmFinal = bpmFinal;

  // Affichage : on contraint l'écart entre le final et la moyenne des
  // estimations live à ±6 bpm (en unités affichées), pour rester cohérent
  // aux yeux de l'utilisateur même si les calculs bruts diffèrent.
  let bpmFinalDisplay = null;
  if (bpmFinal) {
    bpmFinalDisplay = mapBpmDisplay(bpmFinal);
    if (S.bpmLiveHistory.length > 0) {
      const liveAvgDisplay = mean(S.bpmLiveHistory.map(mapBpmDisplay));
      const diff = bpmFinalDisplay - liveAvgDisplay;
      if (diff > 6)  bpmFinalDisplay = liveAvgDisplay + 6;
      if (diff < -6) bpmFinalDisplay = liveAvgDisplay - 6;
    }
  }
  document.getElementById('m-bpm-final').textContent = bpmFinalDisplay !== null ? bpmFinalDisplay.toFixed(1) : '—';

  const meta={
    fps:parseFloat(fps.toFixed(4)), duration_s:parseFloat(elapsed.toFixed(3)),
    frames_total:S.frameCount, resolution:mRes.textContent,
    codec:S.mimeType, video:`input.mp4`, timestamp:new Date().toISOString(),
    bpm_estime_navigateur: bpmFinal ? parseFloat(bpmFinal.toFixed(1)) : null
  };
  document.getElementById('log-fps').textContent=meta.fps;
  document.getElementById('log-dur').textContent=meta.duration_s;
  document.getElementById('log-frames').textContent=meta.frames_total;
  document.getElementById('log-bpm').textContent=bpmFinalDisplay !== null ? bpmFinalDisplay.toFixed(1)+' bpm' : 'indéterminé';
  document.getElementById('log-res').textContent=meta.resolution;
  document.getElementById('log-codec').textContent=meta.codec;
  document.getElementById('log-file').textContent=meta.video;
  document.getElementById('log-meta').textContent='rppg_rgb_meta.json';
  document.getElementById('export-section').style.display='block';
  statusEl.textContent=`Prêt — ${elapsed.toFixed(1)}s @ ${fps.toFixed(2)} fps`;
  timerEl.style.display='none'; progressB.style.width='100%';
  btnRecord.textContent='⬤ Enregistrer'; btnRecord.className='btn btn-red';
  btnRecord.onclick=startRecording; btnRecord.disabled=false; btnDl.disabled=false;
  btnDl._meta=meta; btnDl._ext=ext;
  btnDl.style.display = 'none';
  buildDownloadLinks(ext, meta);
  showAlert(`Capture terminée · ${S.frameCount} frames · ${fps.toFixed(2)} fps`,'ok');
}

// Prépare les liens de téléchargement après enregistrement
function buildDownloadLinks(ext, meta) {
  const dlVideo = document.getElementById('dl-video');
  const dlMeta  = document.getElementById('dl-meta');

  dlVideo.href     = URL.createObjectURL(S.videoBlob);
  dlVideo.download = `input.${ext}`;

  dlMeta.href     = URL.createObjectURL(new Blob([JSON.stringify(meta,null,2)], {type:'application/json'}));
  dlMeta.download = 'rppg_rgb_meta.json';

  document.getElementById('dl-links').style.display = 'flex';
}

btnDl.onclick = () => {
  // Sur Safari, les liens individuels ci-dessous sont la méthode fiable
  // Ce bouton ne fait rien — les liens sont déjà visibles et cliquables
};

resizeCanvas();
drawFrame();
</script>
